<!doctype html>
<html lang="my">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>総まとめ N3 漢字 — Week 1 Flashcards</title>
    <style>
      :root {
        --bg: #0b0d12;
        --surface: #141821;
        --surface2: #1b202c;
        --text: #f5f7fb;
        --muted: #9aa3b2;
        --line: #292f3c;
        --accent: #c9a7ff;
        --good: #82e0a8;
        --bad: #ff8d9b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: radial-gradient(circle at 50% -10%, #222033 0, #0b0d12 45%);
        color: var(--text);
        font-family: Inter, "Noto Sans Myanmar", system-ui, sans-serif;
        min-height: 100vh;
      }

      .wrap {
        max-width: 1050px;
        margin: auto;
        padding: 24px 18px 50px;
      }

      header {
        display: flex;
        gap: 14px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }

      h1 {
        font-size: 22px;
        margin: 0;
      }

      .sub {
        color: var(--muted);
        font-size: 13px;
        margin-top: 4px;
      }

      select,
      button {
        font: inherit;
        color: var(--text);
        background: var(--surface2);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 14px;
        cursor: pointer;
      }

      button:hover,
      select:hover {
        border-color: #514968;
      }

      button.primary {
        background: var(--accent);
        color: #15111c;
        border-color: transparent;
        font-weight: 700;
      }

      .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .stats {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 18px;
      }

      .stat {
        padding: 7px 10px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
      }

      .card {
        background: linear-gradient(145deg, #171b25, #11151d);
        border: 1px solid var(--line);
        border-radius: 24px;
        min-height: 470px;
        padding: 28px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        box-shadow: 0 20px 60px #0005;
      }

      .day {
        color: var(--accent);
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.04em;
      }

      .kanji {
        font-size: 110px;
        line-height: 1.1;
        margin: 18px 0 6px;
        font-family: "Noto Sans JP", "Yu Gothic", serif;
      }

      .reading {
        font-size: 18px;
        color: #ddd6f2;
        min-height: 28px;
      }

      .prompt {
        color: var(--muted);
        margin-top: 20px;
        font-size: 14px;
      }

      .answer {
        width: min(760px, 100%);
        margin-top: 18px;
        text-align: left;
      }

      .readingBox {
        background: #0c1017;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        margin: 8px 0 14px;
        display: flex;
        gap: 22px;
        flex-wrap: wrap;
      }

      .readingBox > div {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 150px;
      }

      .readingBox b {
        color: var(--muted);
        font-size: 12px;
      }

      .readingBox span {
        font-size: 18px;
        color: #ddd6f2;
      }

      .vocab {
        background: #0c1017;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        margin: 8px 0;
      }

      .jp {
        font-size: 19px;
        font-weight: 700;
      }

      .romaji {
        color: var(--muted);
        font-size: 13px;
        margin-left: 7px;
      }

      .my {
        margin-top: 4px;
        line-height: 1.6;
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 9px;
        flex-wrap: wrap;
        margin: 18px 0;
      }

      .progress {
        height: 7px;
        background: #202532;
        border-radius: 99px;
        overflow: hidden;
        margin: 12px 0 22px;
      }

      .progress i {
        display: block;
        height: 100%;
        background: var(--accent);
        width: 0;
      }

      .hint {
        color: var(--muted);
        font-size: 12px;
        text-align: center;
        margin-top: 12px;
      }

      kbd {
        border: 1px solid var(--line);
        border-bottom-width: 2px;
        border-radius: 5px;
        padding: 1px 5px;
        background: #161a23;
      }

      .hidden {
        display: none;
      }

      .score-good {
        color: var(--good);
      }

      .score-bad {
        color: var(--bad);
      }

      @media (max-width: 600px) {
        .wrap {
          padding: 16px 12px 35px;
        }

        .card {
          min-height: 430px;
          padding: 20px 14px;
        }

        .kanji {
          font-size: 88px;
        }

        h1 {
          font-size: 19px;
        }
      }

      .testPanel {
        width: min(760px, 100%);
        text-align: left;
      }

      .testQ {
        background: #0c1017;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px;
        margin-top: 14px;
      }

      .testQ h3 {
        margin: 0 0 12px;
        font-size: 16px;
      }

      .choice {
        display: block;
        width: 100%;
        text-align: left;
        margin: 8px 0;
        padding: 12px 14px;
      }

      .choice.correct {
        border-color: var(--good);
        background: #12251b;
      }

      .choice.wrong {
        border-color: var(--bad);
        background: #28161b;
      }

      .testResult {
        font-size: 20px;
        font-weight: 700;
        text-align: center;
        margin: 18px 0;
      }

      .explain {
        background: #171b25;
        border-left: 3px solid var(--accent);
        padding: 12px 14px;
        border-radius: 8px;
        margin-top: 12px;
        line-height: 1.6;
      }

      .testControls {
        display: flex;
        gap: 9px;
        justify-content: center;
        flex-wrap: wrap;
        margin: 18px 0;
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>日本語総まとめ N3 漢字 — Week 1</h1>
          <div class="sub">1日目〜7日目 · Burmese flashcards</div>
        </div>
        <select id="day"></select>
      </header>
      <div class="toolbar">
        <button id="random">🔀 Random</button
        ><button id="shuffle">🔄 Shuffle</button>
        <button id="reset">Reset progress</button
        ><button id="kanjiTestBtn">📝 Kanji Test</button
        ><button id="grammarTestBtn">📘 Grammar Test</button>
      </div>
      <div class="stats">
        <div class="stat" id="pos"></div>
        <div class="stat">
          Known: <span class="score-good" id="known">0</span>
        </div>
        <div class="stat">
          Need review: <span class="score-bad" id="review">0</span>
        </div>
      </div>
      <div class="progress"><i id="bar"></i></div>
      <section id="testView" class="card hidden">
        <div class="day" id="testTitle"></div>
        <div class="testPanel">
          <div class="stats">
            <div class="stat" id="testPos"></div>
            <div class="stat">Score: <span id="testScore">0</span></div>
            <div class="stat">Pass: <span id="testPass">10</span></div>
          </div>
          <div class="progress"><i id="testBar"></i></div>
          <div id="testContent"></div>
        </div>
      </section>
      <section class="card">
        <div class="day" id="dayTitle"></div>
        <div class="kanji" id="kanji"></div>
        <div class="reading" id="reading"></div>
        <div class="prompt" id="prompt">
          Think of the readings and meanings, then reveal the answer.
        </div>
        <div class="answer hidden" id="answer"></div>
      </section>
      <div class="controls">
        <button id="prev">← Previous</button
        ><button class="primary" id="reveal">Show answer</button
        ><button id="next">Next →</button>
        <button id="know" class="hidden">✓ I know</button
        ><button id="again" class="hidden">↻ Review again</button>
      </div>
      <div id="testControls" class="testControls hidden">
        <button id="testReveal">👁 Reveal answer</button
        ><button id="testNext" class="primary">Next question →</button
        ><button id="testFinish">Finish test</button
        ><button id="exitTest">← Back to flashcards</button>
      </div>
      <div class="hint">
        Keyboard: <kbd>Space</kbd> reveal · <kbd>←</kbd>/<kbd>→</kbd> navigate ·
        <kbd>K</kbd> known · <kbd>R</kbd> review
      </div>
    </div>

        document
          .querySelectorAll(".choice")
          .forEach((b) => (b.onclick = () => chooseTest(+b.dataset.i)));
        $("testNext").disabled = true;
        testAnswered = false;
      }
      function chooseTest(i) {
        if (testAnswered) return;
        testAnswered = true;
        let q = testQs[testIdx],
          bs = [...document.querySelectorAll(".choice")];
        bs[q.ans].classList.add("correct");
        if (i !== q.ans) bs[i].classList.add("wrong");
        else testScore++;
        $("testScore").textContent = testScore;
        $("testFeedback").innerHTML =
          `<div class="explain"><b>${i === q.ans ? "✓ Correct" : "✗ Wrong"}</b><br><b>Answer:</b> ${q.opts[q.ans]}<br>${q.exp}</div>`;
        $("testNext").disabled = false;
      }
      $("testReveal").onclick = () => {
        if (testAnswered) return;
        let q = testQs[testIdx];
        testAnswered = true;
        document.querySelectorAll(".choice")[q.ans].classList.add("correct");
        $("testFeedback").innerHTML =
          `<div class="explain"><b>Answer:</b> ${q.opts[q.ans]}<br>${q.exp}</div>`;
        $("testNext").disabled = false;
      };
      $("testNext").onclick = () => {
        testIdx++;
        renderTest();
      };
      $("testFinish").onclick = showTestResult;
      function showTestResult() {
        $("testTitle").textContent =
          (testMode === "kanji" ? "漢字 Test" : "文法 Test") + " · Result";
        $("testBar").style.width = "100%";
        $("testContent").innerHTML =
          `<div class="testResult">${testScore} / ${testQs.length}<br><span class="${testScore >= 10 ? "score-good" : "score-bad"}">${testScore >= 10 ? "PASS ✓" : "REVIEW NEEDED"}</span></div><div class="explain">${testMode === "kanji" ? "Pass point: 10 / 15." : "Practice pass point: 10 / 15 for now. Sensei has not given the grammar scoring rule yet."}</div>`;
        $("testNext").textContent = "Next test";
        $("testNext").disabled = false;
        $("testNext").onclick = () => enterTest(testMode);
      }
      $("exitTest").onclick = () => {
        testView.classList.add("hidden");
        testControls.classList.add("hidden");
        document
          .querySelector(".card:not(#testView)")
          .classList.remove("hidden");
        document
          .querySelector(".controls:not(#testControls)")
          .classList.remove("hidden");
        render();
      };
      $("kanjiTestBtn").onclick = () => enterTest("kanji");
      $("grammarTestBtn").onclick = () => enterTest("grammar");
      setupDays();
      loadDay(1);
    </script>
  </body>
</html>
